name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon
          POSTGRES_DB: moon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moon -d moon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://moon:moon@localhost:5432/moon?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare P0 smoke database
        run: npx prisma db push --skip-generate

      - name: Run P0 smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > /tmp/moon-dev.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              break
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              cat /tmp/moon-dev.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://localhost:3000/ >/dev/null; then
            cat /tmp/moon-dev.log
            exit 1
          fi

          npm run smoke:p0
